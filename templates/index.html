<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ESXi VM panel</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1c2430;
      --muted: #5c6b7a;
      --line: #d9e0e7;
      --bg: #eef2f5;
      --card: #ffffff;
      --on: #0f7a45;
      --on-bg: #e5f6ec;
      --off: #5c6b7a;
      --off-bg: #eef1f4;
      --danger: #9d1c2b;
      --accent: #0b5cab;
      --bar: #0b5cab;
      --bar-bg: #d9e0e7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    main {
      max-width: 980px;
      margin: 0 auto;
      padding: 28px 18px 48px;
    }
    header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-end;
      margin-bottom: 16px;
    }
    h1 { margin: 0 0 6px; font-size: 28px; }
    p { margin: 0; color: var(--muted); line-height: 1.45; }
    button, .ghost {
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      font: inherit;
      cursor: pointer;
    }
    button:disabled { cursor: wait; opacity: 0.65; }
    .ghost { background: var(--card); color: var(--ink); border: 1px solid var(--line); }
    .primary { background: var(--accent); color: white; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --ink: #e7edf4;
      --muted: #a8b3c0;
      --line: #2c3846;
      --bg: #12181f;
      --card: #1b242e;
      --on: #8ee0b0;
      --on-bg: #163528;
      --off: #a8b3c0;
      --off-bg: #2a3340;
      --danger: #ffb4bc;
      --accent: #9ec0ff;
      --bar: #9ec0ff;
      --bar-bg: #2c3846;
    }
    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 14px;
    }
    .toolbar input {
      flex: 1;
      min-width: 0;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      border-radius: 8px;
      padding: 10px 12px;
      font: inherit;
    }
    .toolbar-actions { display: flex; gap: 8px; }
    .banner {
      margin: 0 0 14px;
      padding: 12px 14px;
      border-radius: 10px;
      background: var(--card);
      color: var(--ink);
      border: 1px solid var(--line);
    }
    .banner.error { border-color: #f0c2c7; background: #fff5f6; color: var(--danger); }
    .banner.ok { border-color: #b7e4c7; background: var(--on-bg); color: var(--on); }
    html[data-theme="dark"] .banner.error { background: #3a2024; border-color: #6e3940; }
    html[data-theme="dark"] .banner.ok { background: #163528; border-color: #2f6b4a; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 13px 14px; border-top: 1px solid var(--line); vertical-align: middle; }
    th { border-top: 0; color: var(--muted); font-size: 13px; font-weight: 600; }
    .name-button {
      background: transparent;
      color: var(--accent);
      padding: 0;
      font-weight: 650;
      text-align: left;
    }
    .name-button:hover { text-decoration: underline; }
    .actions { display: flex; gap: 8px; justify-content: flex-end; }
    .danger {
      background: var(--card);
      color: var(--danger);
      border: 1px solid #f0c2c7;
    }
    .sub { color: var(--muted); font-size: 13px; margin-top: 3px; }
    .pill {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 13px;
      background: var(--off-bg);
      color: var(--off);
    }
    .pill.on { background: var(--on-bg); color: var(--on); }
    .empty, .loading { padding: 28px 16px; color: var(--muted); }
    .progress-wrap {
      margin-top: 8px;
      min-width: 180px;
      max-width: 280px;
    }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .progress-track {
      height: 8px;
      border-radius: 999px;
      background: var(--bar-bg);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: var(--bar);
      transition: width 0.35s ease;
    }
    .progress-fill.pulse {
      animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.55; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>ESXi VM panel</h1>
        <p id="intro">Loading virtual machines…</p>
      </div>
      <button class="ghost" id="refresh" type="button">Refresh</button>
    </header>
    <div class="toolbar">
      <input id="search" type="search" placeholder="Search virtual machines" autocomplete="off">
      <div class="toolbar-actions">
        <button class="ghost" id="theme" type="button">Dark</button>
      </div>
    </div>
    <div id="banner" class="banner" hidden></div>
    <section class="card">
      <div id="loading" class="loading">Reading the VM list from ESXi.</div>
      <table id="table" hidden>
        <thead>
          <tr>
            <th>Virtual machine</th>
            <th>IP</th>
            <th>Power</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </section>
  </main>
  <script>
    const intro = document.querySelector("#intro");
    const banner = document.querySelector("#banner");
    const loading = document.querySelector("#loading");
    const table = document.querySelector("#table");
    const rows = document.querySelector("#rows");
    const refresh = document.querySelector("#refresh");
    const search = document.querySelector("#search");
    const themeButton = document.querySelector("#theme");
    let inFlight = 0;
    let vms = [];
    let hostName = "";
    let ipsLoading = false;
    let ipsRequest = 0;
    const notes = [];
    /** @type {Record<number, {percent:number, detail:string, stage:string}>} */
    const progressByVm = {};

    function applyTheme(theme) {
      document.documentElement.dataset.theme = theme;
      themeButton.textContent = theme === "dark" ? "Light" : "Dark";
      localStorage.setItem("vm-panel-theme", theme);
    }

    function showBanner(text, kind) {
      banner.hidden = !text;
      banner.className = "banner" + (kind ? " " + kind : "");
      banner.textContent = text || "";
    }

    function pill(power) {
      const on = power === "Powered on";
      return `<span class="pill${on ? " on" : ""}">${power}</span>`;
    }

    function render(data) {
      if (data) {
        vms = data.vms || [];
        hostName = data.host || hostName;
      }
      intro.textContent = `Host ${hostName}. Power on waits for VMware Tools before showing 100%. Shut down asks the guest to shut down, and powers the VM off if Tools is not running.`;
      const query = search.value.trim().toLowerCase();
      const visible = vms.filter((vm) => {
        const haystack = `${vm.name} ${vm.guest} ${vm.vmid} ${vm.ip || ""}`.toLowerCase();
        return haystack.includes(query);
      });
      rows.innerHTML = "";
      if (!visible.length) {
        const tr = document.createElement("tr");
        const td = document.createElement("td");
        td.colSpan = 4;
        td.className = "empty";
        td.textContent = query ? "No virtual machines match." : "No virtual machines.";
        tr.appendChild(td);
        rows.appendChild(tr);
        loading.hidden = true;
        table.hidden = false;
        return;
      }
      for (const vm of visible) {
        const tr = document.createElement("tr");
        const nameCell = document.createElement("td");
        const nameButton = document.createElement("button");
        nameButton.className = "name-button";
        nameButton.type = "button";
        nameButton.textContent = vm.name;
        nameButton.addEventListener("click", () => changePower(vm, "on"));
        const sub = document.createElement("div");
        sub.className = "sub";
        sub.textContent = `${vm.guest} · id ${vm.vmid}`;
        nameCell.appendChild(nameButton);
        nameCell.appendChild(sub);
        const prog = progressByVm[vm.vmid];
        if (prog) {
          nameCell.appendChild(progressElement(prog));
        }

        const ipCell = document.createElement("td");
        if (vm.ip) {
          ipCell.textContent = vm.ip;
        } else {
          const emptyIp = document.createElement("span");
          emptyIp.className = "sub";
          emptyIp.textContent = vm.power === "Powered on" ? (ipsLoading ? "…" : "—") : "";
          ipCell.appendChild(emptyIp);
        }

        const powerCell = document.createElement("td");
        powerCell.innerHTML = pill(vm.power);

        const actionCell = document.createElement("td");
        const actions = document.createElement("div");
        actions.className = "actions";
        const busy = Boolean(progressByVm[vm.vmid]);
        actions.appendChild(actionButton("Power on", "primary", vm, "on", vm.power === "Powered on" || busy));
        actions.appendChild(actionButton("Shut down", "danger", vm, "off", vm.power === "Powered off" || busy));
        actionCell.appendChild(actions);

        tr.appendChild(nameCell);
        tr.appendChild(ipCell);
        tr.appendChild(powerCell);
        tr.appendChild(actionCell);
        rows.appendChild(tr);
      }
      loading.hidden = true;
      table.hidden = false;
    }

    function progressElement(prog) {
      const wrap = document.createElement("div");
      wrap.className = "progress-wrap";
      const meta = document.createElement("div");
      meta.className = "progress-meta";
      const label = document.createElement("span");
      label.textContent = prog.detail || prog.stage || "Working…";
      const pct = document.createElement("span");
      pct.textContent = `${Math.max(0, Math.min(100, Number(prog.percent) || 0))}%`;
      meta.appendChild(label);
      meta.appendChild(pct);
      const track = document.createElement("div");
      track.className = "progress-track";
      const fill = document.createElement("div");
      fill.className = "progress-fill" + ((prog.percent || 0) < 100 ? " pulse" : "");
      fill.style.width = `${Math.max(0, Math.min(100, Number(prog.percent) || 0))}%`;
      track.appendChild(fill);
      wrap.appendChild(meta);
      wrap.appendChild(track);
      return wrap;
    }

    function actionButton(label, className, vm, action, disabled) {
      const button = document.createElement("button");
      button.className = className;
      button.type = "button";
      button.textContent = label;
      button.disabled = disabled;
      button.addEventListener("click", () => changePower(vm, action));
      return button;
    }

    function setProgress(vmid, info) {
      progressByVm[vmid] = {
        percent: Number(info.percent) || 0,
        detail: info.detail || info.message || "",
        stage: info.stage || "",
      };
      if (!table.hidden) render();
    }

    function clearProgress(vmid) {
      delete progressByVm[vmid];
    }

    async function loadIps() {
      const powered = vms.filter((vm) => vm.power === "Powered on").map((vm) => vm.vmid);
      if (!powered.length) {
        ipsLoading = false;
        if (!table.hidden) render();
        return;
      }
      const requestId = ++ipsRequest;
      ipsLoading = true;
      if (!table.hidden) render();
      try {
        const response = await fetch(
          "/api/ips?vmids=" + encodeURIComponent(powered.join(",")) + "&t=" + Date.now(),
          { cache: "no-store" }
        );
        const data = await response.json();
        if (requestId !== ipsRequest) return;
        if (!response.ok || !data.ok) throw new Error(data.error || "Could not load IPs");
        const map = data.ips || {};
        for (const vm of vms) {
          if (vm.power === "Powered on") {
            vm.ip = map[String(vm.vmid)] || map[vm.vmid] || "";
          } else {
            vm.ip = "";
          }
        }
      } catch (error) {
        if (requestId === ipsRequest) {
          showBanner(error.message, "error");
        }
      } finally {
        if (requestId === ipsRequest) {
          ipsLoading = false;
          if (!table.hidden) render();
        }
      }
    }

    async function load() {
      refresh.disabled = true;
      refresh.textContent = "Refreshing…";
      try {
        // Fast path: list only. IPs load in the background from VMware Tools.
        const response = await fetch("/api/vms?t=" + Date.now(), { cache: "no-store" });
        const data = await response.json();
        if (!response.ok || !data.ok) throw new Error(data.error || "Could not load VMs");
        render(data);
        loadIps();
      } catch (error) {
        if (!rows.children.length) {
          loading.hidden = false;
          table.hidden = true;
          loading.textContent = "The VM list could not be loaded.";
        }
        showBanner(error.message, "error");
      } finally {
        refresh.disabled = false;
        refresh.textContent = "Refresh";
      }
    }

    async function readNdjson(response, onEvent) {
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      let last = null;
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split("\n");
        buffer = lines.pop() || "";
        for (const line of lines) {
          const trimmed = line.trim();
          if (!trimmed) continue;
          const event = JSON.parse(trimmed);
          last = event;
          onEvent(event);
        }
      }
      const tail = buffer.trim();
      if (tail) {
        const event = JSON.parse(tail);
        last = event;
        onEvent(event);
      }
      return last;
    }

    async function changePower(vm, action) {
      const turningOn = action === "on";
      inFlight += 1;
      setProgress(vm.vmid, {
        percent: turningOn ? 5 : 15,
        stage: "starting",
        detail: turningOn ? `Powering on ${vm.name}…` : `Shutting down ${vm.name}…`,
      });
      showBanner(
        turningOn
          ? `Powering on ${vm.name} and waiting for VMware Tools…`
          : `Shutting down ${vm.name}…`,
        ""
      );
      try {
        const response = await fetch("/api/power", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ vmid: vm.vmid, action: action, stream: true }),
        });
        if (!response.ok && !response.body) {
          const data = await response.json().catch(() => ({}));
          throw new Error(data.error || "Power change failed");
        }
        const last = await readNdjson(response, (event) => {
          if (event.type === "progress" || event.type === "done") {
            setProgress(vm.vmid, event);
            if (event.detail || event.message) {
              showBanner(event.detail || event.message, event.type === "done" ? "ok" : "");
            }
          }
          if (event.type === "done" && event.vms) {
            render(event);
          }
          if (event.type === "error" || event.ok === false) {
            throw new Error(event.error || "Power change failed");
          }
        });
        if (!last || last.ok === false) {
          throw new Error((last && last.error) || "Power change failed");
        }
        notes.push({ ok: true, text: last.message || last.detail || "Done." });
      } catch (error) {
        notes.push({ ok: false, text: error.message });
      } finally {
        clearProgress(vm.vmid);
        inFlight -= 1;
        if (inFlight === 0) {
          const failed = notes.some((item) => !item.ok);
          showBanner(notes.map((item) => item.text).join(" "), failed ? "error" : "ok");
          notes.length = 0;
          await load();
        } else {
          showBanner(`${inFlight} power change(s) still in progress.`, "");
          if (!table.hidden) render();
        }
      }
    }

    search.addEventListener("input", () => {
      if (!table.hidden) render();
    });
    themeButton.addEventListener("click", () => {
      applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
    });
    refresh.addEventListener("click", () => {
      load();
    });
    applyTheme(localStorage.getItem("vm-panel-theme") || "light");
    load();
  </script>
</body>
</html>
